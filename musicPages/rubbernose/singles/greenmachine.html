    <!-- =========================================================
         HOWLER.JS PLAYER
         ========================================================= -->

    <script>

        const songList = [
            '/music/rubbernose/singles/Rubber_Nose-Green_Machine.mp3'
        ];

        let currentSongIndex = 0;

        let currentSong = new Howl({
            src: [songList[currentSongIndex]],
            html5: true,
            onend: playNextSong
        });


        let audioSource;

        let analyser = Howler.ctx.createAnalyser();

        let canvas = document.getElementById('visualizer');

        let ctx = canvas.getContext('2d');


        function playSong(index) {

            currentSong.stop();

            currentSongIndex = index;

            currentSong = new Howl({
                src: [songList[currentSongIndex]],
                html5: true,
                onend: playNextSong
            });

            currentSong.play();

            setupVisualizer();
        }


        function playNextSong() {

            currentSong.stop();

            currentSongIndex =
                (currentSongIndex + 1) % songList.length;

            currentSong = new Howl({
                src: [songList[currentSongIndex]],
                html5: true,
                onend: playNextSong
            });

            currentSong.play();

            setupVisualizer();
        }


        function stopSong() {

            currentSong.stop();

        }


        function setupVisualizer() {

            analyser = Howler.ctx.createAnalyser();

            audioSource =
                Howler.ctx.createMediaElementSource(
                    currentSong._sounds[0]._node
                );

            audioSource.connect(analyser);

            analyser.connect(
                Howler.ctx.destination
            );

            analyser.fftSize = 256;

            visualize();
        }


        function visualize() {

            requestAnimationFrame(visualize);

            const bufferLength =
                analyser.frequencyBinCount;

            const dataArray =
                new Uint8Array(bufferLength);

            analyser.getByteFrequencyData(
                dataArray
            );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const barWidth =
                (canvas.width / bufferLength) * 2.5;

            let x = 0;


            for (
                let i = 0;
                i < bufferLength;
                i++
            ) {

                const barHeight =
                    dataArray[i] / 255 *
                    canvas.height;

                const pulse =
                    Math.sin(
                        (Date.now() / 100) + i
                    ) * 5;

                const hue =
                    (Date.now() / 50 + i * 8) %
                    360;


                ctx.fillStyle =
                    `hsl(${hue}, 100%, 50%)`;


                ctx.fillRect(
                    x,
                    canvas.height -
                    barHeight -
                    pulse,
                    barWidth,
                    barHeight + pulse
                );


                x += barWidth + 1;
            }

        }

    </script>
