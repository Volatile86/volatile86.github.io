const output = document.getElementById("noise");

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function spew() {
    const count = Math.floor(Math.random() * 35) + 1;
    const burst = [];

    for (let i = 0; i < count; i++) {
        burst.push(randomItem(words));
    }

    output.append(
        document.createTextNode(burst.join(" ") + " ")
    );

    window.scrollTo(0, document.body.scrollHeight);

    const delay = Math.random() * 700 + 50;
    setTimeout(spew, delay);
}
